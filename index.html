<style>
  body { font-family:'Inter',sans-serif; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-track { background:#0b132b; } ::-webkit-scrollbar-thumb { background:#1e2f5c; border-radius:4px; } ::-webkit-scrollbar-thumb:hover { background:#22d3ee; }

  .card-hover:hover { border-color:rgba(34,211,238,0.5); box-shadow:0 0 25px rgba(8,145,178,0.25); transform:translateY(-2px); }

  .btn          { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; font-weight:700; font-size:.8rem; padding:.7rem 1rem; border-radius:.75rem; transition:all .2s; cursor:pointer; border:none; min-height:44px; }

  .btn-emerald  { background:#059669; color:#fff; } .btn-emerald:hover  { background:#10b981; }
  .btn-gold     { background:linear-gradient(90deg,#eab308,#d97706); color:#0b132b; } .btn-gold:hover { background:linear-gradient(90deg,#facc15,#f59e0b); }
  .btn-danger   { background:rgba(220,38,38,.3); color:#fca5a5; border:1px solid rgba(239,68,68,.3); } .btn-danger:hover { background:#dc2626; color:#fff; }
  .btn-ghost    { background:rgba(255,255,255,.04); color:#94a3b8; border:1px solid #1e2f5c; } .btn-ghost:hover { background:rgba(34,211,238,.1); color:#a5f3fc; }

  .badge { display:inline-flex; align-items:center; gap:.25rem; font-size:.6rem; font-weight:800; text-transform:uppercase; padding:.3rem .65rem; border-radius:.5rem; letter-spacing:.03em; }
  .badge-red    { background:rgba(239,68,68,.2); color:#f87171; border:1px solid rgba(239,68,68,.3); }
  .badge-amber  { background:rgba(245,158,11,.2); color:#fbbf24; border:1px solid rgba(245,158,11,.3); }
  .badge-gold   { background:rgba(234,179,8,.2); color:#fde047; border:1px solid rgba(234,179,8,.3); }

  .input       { width:100%; padding:.7rem .9rem; border-radius:.75rem; background:rgba(11,19,43,.8); border:1px solid #1e2f5c; color:#fff; font-size:1rem; outline:none; transition:all .2s; min-height:44px; }

  .input::placeholder { color:#475569; }

  .nav-item     { display:flex; align-items:center; gap:.75rem; padding:.75rem; border-radius:.75rem; font-size:.9rem; font-weight:500; color:#94a3b8; transition:all .2s; cursor:pointer; text-decoration:none; min-height:44px; }

  .fab { position:fixed; bottom:1.25rem; right:1.25rem; z-index:40; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0891b2,#2563eb); box-shadow:0 4px 20px rgba(8,145,178,.5); border:none; cursor:pointer; transition:all .2s; }

  .presence-toggle { display:flex; align-items:center; gap:.75rem; padding:.75rem; border-radius:.75rem; background:rgba(11,19,43,.5); border:1px solid #1e2f5c; cursor:pointer; transition:all .2s; min-height:56px; }

  .presence-check { width:22px; height:22px; border-radius:50%; border:2px solid #475569; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .presence-toggle.present .presence-check { background:#10b981; border-color:#10b981; }

  .check-box { width:22px; height:22px; border-radius:6px; border:2px solid #475569; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .member-select-item.checked .check-box { background:#0891b2; border-color:#0891b2; }
  .member-select-item.checked .check-box::after { content:'✓'; color:white; font-size:.7rem; font-weight:900; }
  .member-select-item.checked { background:rgba(8,145,178,.1); border-color:rgba(8,145,178,.4); }

  @media (min-width:640px) { .modal-overlay { align-items:center; } }
  .modal-sheet { background:#111c3a; border:1px solid rgba(34,211,238,.25); padding:1.5rem; border-radius:1.5rem 1.5rem 0 0; width:100%; max-width:520px; animation:slideUp .25s ease; }
  @media (min-width:640px) { .modal-sheet { border-radius:1.5rem; } }
  @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:none; opacity:1; } }

  .kpi { padding:1rem; border-radius:1rem; background:rgba(11,19,43,.6); border:1px solid #1e2f5c; }
  .kpi-value { font-size:1.5rem; font-weight:800; margin-top:.25rem; }
  @media (min-width:640px) { .kpi { padding:1.25rem; } .kpi-value { font-size:1.75rem; } }

  .health-dot { width:.7rem; height:.7rem; border-radius:50%; display:inline-block; }
  .health-dot.emerald { background:#10b981; box-shadow:0 0 8px #10b981; }
  .health-dot.amber   { background:#f59e0b; box-shadow:0 0 8px #f59e0b; }
  .health-dot.red     { background:#ef4444; box-shadow:0 0 8px #ef4444; }

  .cell-tile { padding:1rem; border-radius:1.25rem; border:1px solid; cursor:pointer; transition:all .2s; }
  .cell-tile:hover { transform:translateY(-2px); }
  .cell-tile.healthy  { background:linear-gradient(135deg, rgba(16,185,129,.08), rgba(11,19,43,.6)); border-color:rgba(16,185,129,.35); }
  .cell-tile.warning  { background:linear-gradient(135deg, rgba(245,158,11,.08), rgba(11,19,43,.6)); border-color:rgba(245,158,11,.35); }
  .cell-tile.critical { background:linear-gradient(135deg, rgba(239,68,68,.1), rgba(11,19,43,.6)); border-color:rgba(239,68,68,.4); }

  .trend-up   { color:#10b981; }
  .trend-down { color:#ef4444; }
  .trend-flat { color:#94a3b8; }

  #pwa-install-banner { position:fixed; bottom:80px; left:1rem; right:1rem; z-index:50; padding:1rem; border-radius:1rem; background:linear-gradient(135deg,#111c3a,#0b132b); border:1px solid rgba(34,211,238,.4); box-shadow:0 4px 20px rgba(8,145,178,.4); animation:slideUp .3s ease; }
  @media (min-width:640px) { #pwa-install-banner { left:auto; right:1.5rem; bottom:1.5rem; max-width:360px; } }
  .pwa-hidden { display:none !important; }

  #offline-badge { position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:9998; padding:.5rem 1rem; border-radius:999px; background:rgba(245,158,11,.9); color:#0b132b; font-size:.75rem; font-weight:800; box-shadow:0 4px 12px rgba(245,158,11,.4); display:none; }
  #offline-badge.active { display:block; }

  .contacted-row { opacity:.55; }
  .contacted-tag { display:none; font-size:.6rem; font-weight:800; color:#10b981; background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.4); padding:.15rem .5rem; border-radius:999px; text-transform:uppercase; letter-spacing:.05em; }
  .contacted-row .contacted-tag { display:inline-flex; }

  .search-clear { position:absolute; right:.75rem; top:50%; transform:translateY(-50%); color:#64748b; cursor:pointer; }
  .search-clear:hover { color:#22d3ee; }
</style>

<script>
/* ==========================================================================
   CONFIG / DB / RULES / SEED
   ========================================================================== */
const APP_CONFIG = { name: 'Unidos em Cristo', schemaVersion: 2 };
const STORAGE_PREFIX = 'uec';
const KEY = (k) => `${STORAGE_PREFIX}:${k}:v${APP_CONFIG.schemaVersion}`;

const DB = {
  _get(key, fallback) { try { const r = localStorage.getItem(KEY(key)); return r ? JSON.parse(r) : fallback; } catch { return fallback; } },
  _set(key, value) { try { localStorage.setItem(KEY(key), JSON.stringify(value)); return true; } catch (e) { console.error(e); return false; } },
  uid() { return (crypto?.randomUUID?.()) || ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2)); },

  session: {
    get() { return DB._get('session', null); },
    login(profileId) { const p = DB.profiles.list().find(x => x.id === profileId); if (!p) return false; DB._set('session', { profileId: p.id, since: new Date().toISOString() }); return true; },
    logout() { DB._set('session', null); },
    currentProfile() { const s = DB.session.get(); return s ? DB.profiles.list().find(p => p.id === s.profileId) || null : null; },
  },
  profiles: {
    list() { return DB._get('profiles', []); },
    getById(id) { return DB.profiles.list().find(p => p.id === id); },
    getByUsername(u) { return DB.profiles.list().find(p => p.username?.toLowerCase() === u?.toLowerCase()); },
    getByEmail(email) { return DB.profiles.list().find(p => p.email?.toLowerCase() === email?.toLowerCase()); },
    create(data) { const list = DB.profiles.list(); const row = { id: DB.uid(), createdAt: new Date().toISOString(), ...data }; list.push(row); DB._set('profiles', list); return row; },
    update(id, patch) { DB._set('profiles', DB.profiles.list().map(p => p.id === id ? { ...p, ...patch } : p)); },
  },
  cells: {
    list() { return DB._get('cells', []); },
    getById(id) { return DB.cells.list().find(c => c.id === id); },
    listByCoordinator(cid) { return DB.cells.list().filter(c => c.coordinatorId === cid); },
    create(data) { const list = DB.cells.list(); const row = { id: DB.uid(), active: true, multiplicationThreshold: 30, createdAt: new Date().toISOString(), ...data }; list.push(row); DB._set('cells', list); return row; },
    update(id, patch) { DB._set('cells', DB.cells.list().map(c => c.id === id ? { ...c, ...patch } : c)); return DB.cells.getById(id); },
  },
  members: {
    list() { return DB._get('members', []); },
    listByCell(cid) { return DB.members.list().filter(m => m.cellId === cid); },
    getById(id) { return DB.members.list().find(m => m.id === id); },
    create(data) { const list = DB.members.list(); const row = { id: DB.uid(), status: 'Membro', joinedAt: new Date().toISOString(), ...data }; list.push(row); DB._set('members', list); return row; },
    update(id, patch) { DB._set('members', DB.members.list().map(m => m.id === id ? { ...m, ...patch } : m)); return DB.members.getById(id); },
    remove(id) { DB._set('members', DB.members.list().filter(m => m.id !== id)); },
    moveMany(memberIds, targetCellId) {
      const ids = new Set(memberIds);
      DB._set('members', DB.members.list().map(m => ids.has(m.id) ? { ...m, cellId: targetCellId } : m));
    },
  },
  meetings: {
    list() { return DB._get('meetings', []); },
    listByCell(cid) { return DB.meetings.list().filter(m => m.cellId === cid); },
    latestByCell(cid) { return DB.meetings.listByCell(cid).sort((a, b) => new Date(b.date) - new Date(a.date))[0] || null; },
    create(data) { const list = DB.meetings.list(); const row = { id: DB.uid(), createdAt: new Date().toISOString(), ...data }; list.push(row); DB._set('meetings', list); return row; },
  },
  attendance: {
    list() { return DB._get('attendance', []); },
    listByMeeting(mid) { return DB.attendance.list().filter(a => a.meetingId === mid); },
    markMany(meetingId, memberIds, present) {
      const list = DB.attendance.list();
      memberIds.forEach(mid => { const idx = list.findIndex(a => a.meetingId === meetingId && a.memberId === mid); if (idx >= 0) list[idx].present = present; else list.push({ id: DB.uid(), meetingId, memberId: mid, present }); });
      DB._set('attendance', list);
    },
  },
  transactions: {
    list() { return DB._get('transactions', []); },
    listByCell(cid) { return DB.transactions.list().filter(t => t.cellId === cid).sort((a, b) => new Date(b.date) - new Date(a.date)); },
    balance(cid) { return DB.transactions.listByCell(cid).reduce((s, t) => s + (t.type === 'Entrada' ? +t.amount : -t.amount), 0); },
    create(data) { const list = DB.transactions.list(); const row = { id: DB.uid(), createdAt: new Date().toISOString(), ...data }; list.push(row); DB._set('transactions', list); return row; },
    remove(id) { DB._set('transactions', DB.transactions.list().filter(t => t.id !== id)); },
  },
  contacts: {
    list() { return DB._get('contacts', []); },
    isContacted(memberId, kind) {
      const since = Date.now() - 3 * 86400000;
      return DB.contacts.list().some(c => c.memberId === memberId && c.kind === kind && new Date(c.at).getTime() >= since);
    },
    mark(memberId, kind) {
      const list = DB.contacts.list();
      list.push({ id: DB.uid(), memberId, kind, at: new Date().toISOString() });
      DB._set('contacts', list);
    },
    lastContact(memberId) {
      const list = DB.contacts.list().filter(c => c.memberId === memberId).sort((a, b) => new Date(b.at) - new Date(a.at));
      return list[0] || null;
    },
  },
  reset() { Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX)).forEach(k => localStorage.removeItem(k)); },
};

const Rules = {
  membersAtRisk(cellId, n = 3) {
    const meetings = DB.meetings.listByCell(cellId).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, n);
    if (meetings.length < n) return [];
    const members = DB.members.listByCell(cellId);
    const att = DB.attendance.list();
    return members.filter(m => {
      if (m.status === 'Visitante') return false;
      return meetings.every(meet => { const rec = att.find(a => a.meetingId === meet.id && a.memberId === m.id); return rec ? rec.present === false : true; });
    });
  },
  absentLastMeeting(cellId) {
    const last = DB.meetings.latestByCell(cellId); if (!last) return [];
    const att = DB.attendance.listByMeeting(last.id);
    return DB.members.listByCell(cellId).filter(m => {
      if (m.status === 'Visitante') return false;
      const rec = att.find(a => a.memberId === m.id);
      return rec ? rec.present === false : true;
    });
  },
  shouldMultiply(cellId) {
    const cell = DB.cells.getById(cellId); if (!cell) return false;
    const total = DB.members.listByCell(cellId).filter(m => m.status !== 'Visitante').length;
    return total >= (cell.multiplicationThreshold || 30);
  },
  cellHealth(cellId) {
    const last = DB.meetings.latestByCell(cellId);
    if (!last) return { status: 'Sem reunião', days: null, color: 'red' };
    const days = Math.floor((Date.now() - new Date(last.date).getTime()) / 86400000);
    if (days <= 7) return { status: 'Saudável', days, color: 'emerald' };
    if (days <= 15) return { status: 'Atenção', days, color: 'amber' };
    return { status: 'Inativa', days, color: 'red' };
  },
  averageAttendance(cellId, days = 30) {
    const since = Date.now() - days * 86400000;
    const meets = DB.meetings.listByCell(cellId).filter(m => new Date(m.date).getTime() >= since);
    if (meets.length === 0) return null;
    return meets.reduce((s, m) => s + +m.attendeesCount, 0) / meets.length;
  },
  attendanceTrend(cellId) {
    const now = Date.now();
    const cut = now - 30 * 86400000, prevCut = now - 60 * 86400000;
    const meets = DB.meetings.listByCell(cellId);
    const recent = meets.filter(m => { const t = new Date(m.date).getTime(); return t >= cut && t <= now; });
    const prev   = meets.filter(m => { const t = new Date(m.date).getTime(); return t >= prevCut && t < cut; });
    if (recent.length === 0 && prev.length === 0) return { trend: 'flat', diff: 0 };
    const avgR = recent.length ? recent.reduce((s, m) => s + +m.attendeesCount, 0) / recent.length : 0;
    const avgP = prev.length   ? prev.reduce((s, m) => s + +m.attendeesCount, 0) / prev.length : 0;
    const diff = avgR - avgP;
    const trend = Math.abs(diff) < 1 ? 'flat' : diff > 0 ? 'up' : 'down';
    return { trend, diff: +diff.toFixed(1), avgRecent: +avgR.toFixed(1), avgPrev: +avgP.toFixed(1) };
  },
  growth(cellId, days = 30) {
    const since = Date.now() - days * 86400000;
    return DB.members.listByCell(cellId).filter(m => new Date(m.joinedAt).getTime() >= since).length;
  },
  recentConversions(cellId, days = 30) {
    const since = Date.now() - days * 86400000;
    return DB.meetings.listByCell(cellId).filter(m => new Date(m.date).getTime() >= since).reduce((s, m) => s + +m.conversionsCount, 0);
  },
  pastoralPriority(cellId) {
    const health = Rules.cellHealth(cellId);
    const risk = Rules.membersAtRisk(cellId).length;
    const trend = Rules.attendanceTrend(cellId);
    let score = 0;
    if (health.days !== null) score += Math.min(health.days, 30); else score += 30;
    score += risk * 5;
    if (trend.trend === 'down') score += 10;
    return score;
  },
  tileStatus(cellId) {
    const h = Rules.cellHealth(cellId);
    if (h.color === 'emerald') return 'healthy';
    if (h.color === 'amber') return 'warning';
    return 'critical';
  },
  searchAll(query) {
    if (!query || query.length < 2) return { cells: [], members: [] };
    const q = query.toLowerCase().trim();
    const cells = DB.cells.list().filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.leaderName.toLowerCase().includes(q) ||
      (c.location || '').toLowerCase().includes(q)
    );
    const members = DB.members.list().filter(m =>
      m.name.toLowerCase().includes(q) ||
      (m.phone || '').includes(q)
    ).slice(0, 20);
    return { cells, members };
  },
};

const Router = {
  routes: {},
  publicRoutes: ['#/login','#/register'],
  navigate(hash) { if (location.hash === hash) Router.resolve(); else location.hash = hash; },
  resolve() {
    UI.closeSidebar();
    const hash = location.hash || '#/login';
    const profile = DB.session.currentProfile();
    if (Router.publicRoutes.includes(hash)) {
      if (profile) return Router.navigate(profile.role === 'Líder' ? '#/dashboard' : '#/coordenador');
      return Router._renderRoute(hash);
    }
    if (!profile) return Router.navigate('#/login');
    if (profile.role === 'Líder' && (hash.startsWith('#/coordenador') || hash.startsWith('#/cells/new'))) {
      UI.toast('Acesso restrito ao coordenador.', 'error');
      return Router.navigate('#/dashboard');
    }
    if (profile.role === 'Coordenador' || profile.role === 'Supervisor') {
      const coordAllowed = ['#/coordenador', '#/cells/new'];
      if (!coordAllowed.includes(hash)) {
        UI.toast('Coordenação não executa funções operacionais de célula.', 'info');
        return Router.navigate('#/coordenador');
      }
    }
    Router._renderRoute(hash);
  },
  _renderRoute(hash) {
    const page = Router.routes[hash];
    const app = document.getElementById('app');
    const topbar = document.getElementById('topbar');
    const fab = document.getElementById('fab');
    const showSidebar = !Router.publicRoutes.includes(hash);
    const showFab = showSidebar && ['#/dashboard','#/reunioes','#/membros'].includes(hash);
    document.getElementById('sidebar').classList.toggle('hidden', !showSidebar);
    document.getElementById('sidebar').classList.toggle('lg:flex', showSidebar);
    topbar.classList.toggle('hidden', !showSidebar);
    topbar.classList.toggle('flex', showSidebar);
    fab.classList.toggle('hidden', !showFab);
    if (showSidebar) {
      renderSidebar(hash);
      const p = DB.session.currentProfile();
      if (p) document.getElementById('topbar-avatar').textContent = p.name.charAt(0).toUpperCase();
    }
    if (!page) { app.innerHTML = `<div class="text-center py-20 text-slate-400">Rota não encontrada.</div>`; return; }
    app.className = showSidebar ? 'flex-1 overflow-y-auto p-4 sm:p-6 lg:p-10' : 'flex-1 min-h-screen flex items-center justify-center p-4';
    app.innerHTML = `<div class="fade-in">${page.render()}</div>`;
    page.mount?.();
  },
};

      const CACHE = 'unidos-inline-v2';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', location.pathname])).then(() => self.skipWaiting()).catch(() => self.skipWaiting()));
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
      });
      self.addEventListener('fetch', e => {
        const req = e.request;
        if (req.method !== 'GET') return;
        const url = new URL(req.url);
        if (url.origin !== self.location.origin) return;
        e.respondWith(
          caches.match(req).then(cached => {
            if (cached) { fetch(req).then(res => { if (res.ok) caches.open(CACHE).then(c => c.put(req, res)); }).catch(() => {}); return cached; }
            return fetch(req).then(res => { if (res.ok) { const cl = res.clone(); caches.open(CACHE).then(c => c.put(req, cl)); } return res; }).catch(() => {
              if (req.mode === 'navigate') return caches.match('./');
            });
          })
        );
      });
    `;
    try {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url, { scope: './' })
        .then(reg => console.log('[PWA] SW registrado via Blob:', reg.scope))
        .catch(err => console.warn('[PWA] Falha SW Blob (comum em alguns navegadores):', err));
    } catch (e) { console.warn('[PWA] erro ao criar SW Blob:', e); }
  },

  showBanner() {
    if (localStorage.getItem('uec:pwa-dismissed')) return;
    document.getElementById('pwa-install-banner').classList.remove('pwa-hidden');
  },
  hideBanner() { document.getElementById('pwa-install-banner').classList.add('pwa-hidden'); },
  dismiss() { PWA.hideBanner(); localStorage.setItem('uec:pwa-dismissed', '1'); },
  async install() {
    if (!PWA.deferredPrompt) { UI.toast('Instalação indisponível neste navegador.', 'info'); return; }
    PWA.deferredPrompt.prompt();
    const { outcome } = await PWA.deferredPrompt.userChoice;
    if (outcome === 'accepted') UI.toast('Instalando...', 'success');
    PWA.deferredPrompt = null;
    PWA.hideBanner();
  },
};

    const statusBadge = m.status === 'Líder em Treinamento' ? 'badge-cyan' : m.status === 'Novo Convertido' ? 'badge-emerald' : 'badge-slate';
    return `<div class="member-select-item flex items-center gap-3 p-2.5 rounded-lg bg-dark-bg/60 border border-dark-border cursor-pointer" data-mid="${m.id}" onclick="MultiplicacaoPage.toggle('${m.id}')">

    const s = MultiplicacaoPage.state.selected;
    if (s.has(mid)) s.delete(mid); else s.add(mid);

    if (el) el.classList.toggle('checked', s.has(mid));
    MultiplicacaoPage.updateCount();

      UI.toast(`Célula "${name}" criada!`, 'success');
      Router.resolve();
    });

};

        <div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-600 to-blue-600 flex items-center justify-center font-bold text-sm flex-shrink-0">${m.name.charAt(0).toUpperCase()}</div>
          <div class="min-w-0"><h3 class="text-sm font-bold text-white truncate">${UI.escapeHtml(m.name)}</h3><p class="text-[11px] text-slate-400">${m.phone ? '+' + phone : 'Sem telefone'}</p></div></div>
        <span class="badge ${badge}">${UI.escapeHtml(m.status)}</span>
      </div>
      <div class="flex items-center gap-2 mt-3">
        ${phone ? `<a href="https://wa.me/${phone}" target="_blank" class="btn btn-emerald btn-sm flex-1">💬</a>` : ''}
        <button onclick="MembrosPage.openForm('${m.id}')" class="btn btn-ghost btn-sm flex-1">✏️</button>
        <button onclick="MembrosPage.confirmDelete('${m.id}','${UI.escapeHtml(m.name)}')" class="btn btn-danger btn-sm">🗑️</button>
      </div>
    </div>`;
  },
  filter(q) {

    document.querySelectorAll('#membros-list [data-search]').forEach(el => el.style.display = !t || el.dataset.search.includes(t) ? '' : 'none');

  openForm(id = null) {

    document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) UI.closeModal()"><div class="modal-sheet max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold text-white mb-4">${m ? 'Editar' : 'Novo'} Membro</h3>
      <form onsubmit="MembrosPage.save(event, '${id || ''}')" class="space-y-3">
        <div><label class="label">Nome *</label><input id="mem-name" class="input" required value="${m ? UI.escapeHtml(m.name) : ''}" /></div>
        <div><label class="label">Telefone</label><input id="mem-phone" class="input" value="${m ? (m.phone || '') : ''}" /></div>
        <div><label class="label">Status</label><select id="mem-status" class="input">${['Membro','Líder em Treinamento','Novo Convertido','Visitante'].map(s => `<option value="${s}" ${m && m.status === s ? 'selected' : ''} class="bg-dark-bg">${s}</option>`).join('')}</select></div>
        <div class="grid grid-cols-2 gap-3 pt-2"><button type="button" class="btn btn-ghost" onclick="UI.closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div>
      </form></div></div>`;
  },
  save(e, id) {
    e.preventDefault();
    const profile = DB.session.currentProfile();
    const name = document.getElementById('mem-name').value.trim();
    const phone = document.getElementById('mem-phone').value.trim();
    const status = document.getElementById('mem-status').value;
    if (!name) return;
    if (id) { DB.members.update(id, { name, phone, status }); UI.toast('Atualizado!', 'success'); }
    else { DB.members.create({ cellId: profile.cellId, name, phone, status }); UI.toast('Cadastrado!', 'success'); }
    UI.closeModal(); Router.resolve();
  },
  confirmDelete(id, name) { UI.confirm(`Remover "${name}"?`, () => { DB.members.remove(id); UI.toast('Removido.', 'success'); Router.resolve(); }); },
  mount() {},
};

/* ==========================================================================
   NOVA REUNIÃO
   ========================================================================== */
const ReuniaoNovaPage = {
  state: { presence: {} },
  render() {
    const profile = DB.session.currentProfile();
    const cell = DB.cells.getById(profile.cellId);
    if (!cell) return `<div class="card p-8 text-center"><p class="text-slate-400">Sem célula.</p></div>`;
    const members = DB.members.listByCell(cell.id).filter(m => m.status !== 'Visitante');
    ReuniaoNovaPage.state.presence = {};
    members.forEach(m => ReuniaoNovaPage.state.presence[m.id] = true);
    const today = new Date().toISOString().slice(0, 10);
    return `<header class="mb-6"><h1 class="text-2xl sm:text-3xl font-extrabold text-white">Registrar Reunião</h1><p class="text-xs sm:text-sm text-cyan-100/60 mt-1">${UI.escapeHtml(cell.name)}</p></header>
      <form onsubmit="ReuniaoNovaPage.submit(event)" class="space-y-4 max-w-3xl">
        <div class="card p-4 sm:p-6 space-y-4">
          <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest">Dados</h2>
          <div class="grid gap-3 sm:grid-cols-2"><div><label class="label">Data *</label><input id="meet-date" type="date" class="input" required value="${today}" /></div><div><label class="label">Tema *</label><input id="meet-theme" class="input" required /></div></div>
          <div class="grid gap-3 sm:grid-cols-3">
            <div><label class="label">Visitantes</label><input id="meet-visitors" type="number" min="0" class="input" value="0" /></div>
            <div><label class="label">Conversões</label><input id="meet-conversions" type="number" min="0" class="input" value="0" /></div>
            <div><label class="label">Oferta (R$)</label><input id="meet-offering" type="number" min="0" step="0.01" class="input" value="0" /></div>
          </div>
        </div>
        <div class="card p-4 sm:p-6">
          <div class="flex items-center justify-between mb-3"><h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest">Presença (${members.length})</h2>
            <div class="flex gap-2"><button type="button" onclick="ReuniaoNovaPage.setAll(true)" class="btn btn-ghost btn-sm">Todos</button><button type="button" onclick="ReuniaoNovaPage.setAll(false)" class="btn btn-ghost btn-sm">Nenhum</button></div></div>
          <div class="grid gap-2 sm:grid-cols-2">${members.length === 0 ? `<div class="text-sm text-slate-400 p-4 col-span-full">Sem membros.</div>` : members.map(m => `<div class="presence-toggle present" data-mid="${m.id}" onclick="ReuniaoNovaPage.toggle('${m.id}')"><div class="presence-check"></div><span class="text-sm text-white flex-1">${UI.escapeHtml(m.name)}</span></div>`).join('')}</div>
          <div class="mt-3 text-xs text-slate-400"><span id="presence-count" class="font-bold text-emerald-400">${members.length}</span> de ${members.length}</div>
        </div>
        <div class="flex flex-col sm:flex-row gap-2 sm:justify-end"><button type="button" class="btn btn-ghost" onclick="Router.navigate('#/dashboard')">Cancelar</button><button type="submit" class="btn btn-primary !py-3">💾 Salvar</button></div>
      </form>`;
  },
  toggle(mid) { const el = document.querySelector(`[data-mid="${mid}"]`); ReuniaoNovaPage.state.presence[mid] = !ReuniaoNovaPage.state.presence[mid]; el.classList.toggle('present', ReuniaoNovaPage.state.presence[mid]); el.classList.toggle('absent', !ReuniaoNovaPage.state.presence[mid]); ReuniaoNovaPage.updateCount(); },
  setAll(v) { Object.keys(ReuniaoNovaPage.state.presence).forEach(mid => { ReuniaoNovaPage.state.presence[mid] = v; const el = document.querySelector(`[data-mid="${mid}"]`); if (el) { el.classList.toggle('present', v); el.classList.toggle('absent', !v); } }); ReuniaoNovaPage.updateCount(); },
  updateCount() { const c = Object.values(ReuniaoNovaPage.state.presence).filter(Boolean).length; document.getElementById('presence-count').textContent = c; },
  submit(e) {
    e.preventDefault();
    const profile = DB.session.currentProfile();
    const date = document.getElementById('meet-date').value;
    const theme = document.getElementById('meet-theme').value.trim();
    const visitors = +document.getElementById('meet-visitors').value || 0;
    const conversions = +document.getElementById('meet-conversions').value || 0;
    const offering = +document.getElementById('meet-offering').value || 0;
    const presentIds = Object.entries(ReuniaoNovaPage.state.presence).filter(([,v]) => v).map(([k]) => k);
    if (!date || !theme) { UI.toast('Preencha data e tema.', 'error'); return; }
    const meeting = DB.meetings.create({ cellId: profile.cellId, date, theme, attendeesCount: presentIds.length, visitorsCount: visitors, conversionsCount: conversions, offeringsAmount: offering });
    Object.keys(ReuniaoNovaPage.state.presence).forEach(mid => DB.attendance.markMany(meeting.id, [mid], presentIds.includes(mid)));
    if (offering > 0) DB.transactions.create({ cellId: profile.cellId, type: 'Entrada', amount: offering, date, description: `Oferta (${theme})` });
    UI.toast('Registrada!', 'success'); Router.navigate('#/reunioes');
  },
  mount() {},
};

const CaixaPage = {
  render() {
    const profile = DB.session.currentProfile();
    const balance = DB.transactions.balance(profile.cellId);
    const txs = DB.transactions.listByCell(profile.cellId);
    const totalIn = txs.filter(t => t.type === 'Entrada').reduce((s, t) => s + +t.amount, 0);
    const totalOut = txs.filter(t => t.type === 'Saída').reduce((s, t) => s + +t.amount, 0);
    return `<header class="mb-6"><h1 class="text-2xl sm:text-3xl font-extrabold text-white">Livro Caixa</h1><p class="text-xs sm:text-sm text-cyan-100/60 mt-1">Controle financeiro</p></header>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
        <div class="kpi"><p class="text-xs text-slate-400">Saldo</p><p class="kpi-value text-emerald-400">R$ ${balance.toFixed(2).replace('.',',')}</p></div>
        <div class="kpi"><p class="text-xs text-slate-400">Entradas</p><p class="kpi-value text-cyan-400">R$ ${totalIn.toFixed(2).replace('.',',')}</p></div>
        <div class="kpi"><p class="text-xs text-slate-400">Saídas</p><p class="kpi-value text-red-400">R$ ${totalOut.toFixed(2).replace('.',',')}</p></div>

      <div class="flex flex-col sm:flex-row gap-2 mb-6">

        <button onclick="CaixaPage.openForm('Saída')" class="btn btn-danger w-full sm:w-auto">− Retirada</button>
      </div>
      <div class="card p-4 sm:p-6"><h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-4">Movimentações</h2>
        ${txs.length === 0 ? `<div class="text-center py-8 text-slate-400 text-sm">Nenhuma.</div>` : `<div class="space-y-2">${txs.map(t => CaixaPage.row(t)).join('')}</div>`}
      </div>`;
  },
  row(t) {
    const dateBr = new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR');
    const isIn = t.type === 'Entrada';
    return `<div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-dark-bg/60 border border-dark-border">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-lg ${isIn ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'} flex items-center justify-center text-sm font-bold flex-shrink-0">${isIn ? '↑' : '↓'}</div>
        <div class="min-w-0"><p class="text-sm font-semibold text-white truncate">${UI.escapeHtml(t.description)}</p><p class="text-[11px] text-slate-400">${dateBr}</p></div>
      </div>
      <div class="text-right flex-shrink-0"><p class="text-sm font-bold ${isIn ? 'text-emerald-400' : 'text-red-400'}">${isIn ? '+' : '−'} R$ ${(+t.amount).toFixed(2).replace('.',',')}</p>
        <button onclick="CaixaPage.confirmDelete('${t.id}')" class="text-[10px] text-slate-500 hover:text-red-400 mt-1">remover</button>
      </div></div>`;
  },
  openForm(type) {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) UI.closeModal()"><div class="modal-sheet">
      <h3 class="text-lg font-bold text-white mb-4">${type === 'Entrada' ? '+ Entrada' : '− Retirada'}</h3>
      <form onsubmit="CaixaPage.save(event, '${type}')" class="space-y-3">
        <div><label class="label">Valor (R$) *</label><input id="tx-amount" type="number" min="0.01" step="0.01" class="input" required /></div>
        <div><label class="label">Descrição *</label><input id="tx-desc" class="input" required /></div>
        <div><label class="label">Data</label><input id="tx-date" type="date" class="input" value="${today}" /></div>
        <div class="grid grid-cols-2 gap-3 pt-2"><button type="button" class="btn btn-ghost" onclick="UI.closeModal()">Cancelar</button><button type="submit" class="btn ${type === 'Entrada' ? 'btn-emerald' : 'btn-danger'}">Salvar</button></div>
      </form></div></div>`;
  },
  save(e, type) {
    e.preventDefault();
    const profile = DB.session.currentProfile();
    const amount = +document.getElementById('tx-amount').value;
    const description = document.getElementById('tx-desc').value.trim();
    const date = document.getElementById('tx-date').value || new Date().toISOString().slice(0, 10);
    if (!amount || !description) return;
    DB.transactions.create({ cellId: profile.cellId, type, amount, date, description });
    UI.toast('Salvo!', 'success'); UI.closeModal(); Router.resolve();
  },

  mount() {},
};

/* ==========================================================================
   PASTOREIO (B5 + B6)
   ========================================================================== */
const PastoreioPage = {
  state: { selected: new Set(), currentKind: null },

  render() {
    const profile = DB.session.currentProfile();
    const cell = DB.cells.getById(profile.cellId);
    if (!cell) return `<div class="card p-8 text-center"><p class="text-slate-400">Sem célula.</p></div>`;
    const members = DB.members.listByCell(cell.id);
    const visitors = members.filter(m => m.status === 'Visitante');
    const converts = members.filter(m => m.status === 'Novo Convertido');
    const absent = Rules.absentLastMeeting(cell.id);
    return `<header class="mb-6"><h1 class="text-2xl sm:text-3xl font-extrabold text-white">Pastoreio & WhatsApp</h1><p class="text-xs sm:text-sm text-cyan-100/60 mt-1">Central de mensagens em lote</p></header>
      <div class="grid gap-4 sm:grid-cols-2 mb-6">
        ${PastoreioPage.card('🙏','Agradecer Visitantes','Mensagem de gratidão.',visitors.length,'badge-gold',() => PastoreioPage.openPicker('visitors'))}
        ${PastoreioPage.card('🌱','Boas-vindas','Acolhimento.',converts.length,'badge-emerald',() => PastoreioPage.openPicker('converts'))}
        ${PastoreioPage.card('⚠️','Reengajar Ausentes','Contato pastoral.',absent.length,'badge-amber',() => PastoreioPage.openPicker('absent'))}
        ${PastoreioPage.card('📅','Escala','Lembrete da reunião.',members.length,'badge-cyan',() => PastoreioPage.openPicker('all'))}
      </div>`;
  },

  card(icon, title, desc, count, badgeClass, onClick) {
    return `<div class="card card-hover p-4 sm:p-5 flex flex-col justify-between cursor-pointer" onclick="(${onClick.toString()})()">
      <div><div class="flex items-start justify-between mb-3"><div class="text-2xl">${icon}</div><span class="badge ${badgeClass}">${count}</span></div>
      <h3 class="text-base font-bold text-white mb-1">${title}</h3><p class="text-xs text-cyan-100/50">${desc}</p></div>
      <button class="btn btn-emerald btn-sm mt-4 w-full">Abrir</button></div>`;
  },

  openPicker(kind) {
    const profile = DB.session.currentProfile();
    const members = DB.members.listByCell(profile.cellId);
    let filtered = [], template = '', title = '';
    if (kind === 'visitors') { filtered = members.filter(m => m.status === 'Visitante'); title = 'Visitantes'; template = `Olá {nome}! Foi uma alegria ter você! 🙏`; }
    else if (kind === 'converts') { filtered = members.filter(m => m.status === 'Novo Convertido'); title = 'Novos Convertidos'; template = `Parabéns {nome} pela decisão! 🌱`; }
    else if (kind === 'absent') { filtered = Rules.absentLastMeeting(profile.cellId); title = 'Ausentes'; template = `Olá {nome}! Sentimos sua falta. 🙏`; }
    else { filtered = members; title = 'Todos'; template = `Olá {nome}! Lembrete da nossa reunião. 📅`; }

    PastoreioPage.state.selected = new Set();
    PastoreioPage.state.currentKind = kind;

    document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) UI.closeModal()">
      <div class="modal-sheet max-h-[92vh] overflow-y-auto !max-w-2xl">
        <div class="flex items-start justify-between mb-3">
          <div><h3 class="text-lg font-bold text-white">${title}</h3><p class="text-xs text-slate-400 mt-0.5">${filtered.length} contato${filtered.length !== 1 ? 's' : ''}</p></div>
          <button onclick="UI.closeModal()" class="text-slate-400 hover:text-white">${ICONS.close}</button>
        </div>
        <div class="mb-3">
          <label class="label">Mensagem</label>
          <textarea id="past-template" class="input !min-h-[100px]" rows="4">${template}</textarea>
          <div class="flex items-center justify-between mt-1">
            <p class="text-[11px] text-slate-500">Use <code class="text-cyan-400">{nome}</code> para o nome.</p>
            <button onclick="PastoreioPage.copyMessage()" class="text-[11px] text-cyan-400 hover:text-cyan-300 font-bold">📋 Copiar</button>
          </div>
        </div>
        ${filtered.length === 0 ? `<div class="text-center py-6 text-slate-400 text-sm">Nenhum contato.</div>` : `
          <div class="flex items-center justify-between mb-2">
            <label class="label !mb-0">Contatos (${filtered.length})</label>
            <button onclick="PastoreioPage.setAll(true)" class="text-[10px] text-cyan-400 hover:text-cyan-300 font-bold">Selecionar todos</button>
          </div>
          <div class="space-y-1.5 max-h-[40vh] overflow-y-auto" id="pastoreio-list">
            ${filtered.map(m => PastoreioPage.row(m, kind)).join('')}
          </div>
        `}
        <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-dark-border">
          <button class="btn btn-ghost" onclick="UI.closeModal()">Fechar</button>
          <button class="btn btn-emerald" onclick="PastoreioPage.sendBatch()">📲 Enviar lote</button>
        </div>
        <p class="text-[10px] text-slate-500 text-center mt-3">WhatsApp abrirá em nova aba para cada envio.</p>
      </div>
    </div>`;
  },

  row(m, kind) {
    const phone = m.phone?.replace(/\D/g, '') || '';
    const isContacted = DB.contacts.isContacted(m.id, kind);
    const contactedTag = isContacted ? '<span class="contacted-tag">✓ Contatado</span>' : '';
    return `<div class="member-select-item flex items-center gap-2 p-2.5 rounded-lg bg-dark-bg/60 border border-dark-border cursor-pointer ${isContacted ? 'contacted-row' : ''}" data-mid="${m.id}" onclick="PastoreioPage.toggle('${m.id}')">
      <div class="check-box"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <p class="text-sm font-semibold text-white truncate">${UI.escapeHtml(m.name)}</p>
          ${contactedTag}
        </div>
        <p class="text-[11px] text-slate-400">${m.phone || '—'}</p>
      </div>
      <button onclick="event.stopPropagation(); PastoreioPage.sendOne('${m.id}', '${kind}')" ${phone ? '' : 'disabled'} class="btn btn-emerald btn-sm !min-h-[32px] !py-1 !px-2">💬</button>
    </div>`;
  },

  toggle(mid) {
    const s = PastoreioPage.state.selected;
    if (s.has(mid)) s.delete(mid); else s.add(mid);
    const el = document.querySelector(`[data-mid="${mid}"]`);
    if (el) el.classList.toggle('checked', s.has(mid));
  },

  setAll(v) {
    const items = document.querySelectorAll('.member-select-item');
    PastoreioPage.state.selected = new Set();
    items.forEach(el => {
      if (v) PastoreioPage.state.selected.add(el.dataset.mid);
      el.classList.toggle('checked', v);
    });
  },

  copyMessage() {
    const text = document.getElementById('past-template').value;
    UI.copy(text);
  },

  sendOne(memberId, kind) {
    const m = DB.members.getById(memberId);
    const template = document.getElementById('past-template').value;
    const text = template.replace(/\{nome\}/g, m.name);
    const phone = m.phone?.replace(/\D/g, '');
    if (!phone) { UI.toast('Sem telefone.', 'error'); return; }
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    DB.contacts.mark(m.id, kind);
    UI.toast(`${m.name} marcado como contatado.`, 'success');
    const el = document.querySelector(`[data-mid="${m.id}"]`);
    if (el) {
      el.classList.add('contacted-row');
      const name = el.querySelector('p');
      if (name && !el.querySelector('.contacted-tag')) {
        const tag = document.createElement('span');
        tag.className = 'contacted-tag';
        tag.textContent = '✓ Contatado';
        name.parentElement.appendChild(tag);
      }
    }
  },

  sendBatch() {
    const selected = Array.from(PastoreioPage.state.selected);
    if (selected.length === 0) { UI.toast('Selecione ao menos 1 contato.', 'error'); return; }
    const template = document.getElementById('past-template').value;
    const kind = PastoreioPage.state.currentKind;
    const members = selected.map(id => DB.members.getById(id)).filter(m => m?.phone);
    if (members.length === 0) { UI.toast('Nenhum selecionado tem telefone.', 'error'); return; }
    UI.toast(`Abrindo ${members.length} conversa(s)...`, 'info');
    let i = 0;
    const next = () => {
      if (i >= members.length) { UI.toast(`${members.length} conversa(s) aberta(s).`, 'success'); return; }
      const m = members[i++];
      const text = template.replace(/\{nome\}/g, m.name);
      const phone = m.phone.replace(/\D/g, '');
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
      DB.contacts.mark(m.id, kind);
      const el = document.querySelector(`[data-mid="${m.id}"]`);
      if (el) {
        el.classList.add('contacted-row');
        const name = el.querySelector('p');
        if (name && !el.querySelector('.contacted-tag')) {
          const tag = document.createElement('span');
          tag.className = 'contacted-tag';
          tag.textContent = '✓ Contatado';
          name.parentElement.appendChild(tag);
        }
      }
      setTimeout(next, 400);
    };
    next();
  },

  mount() {},
};

            <p class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest">Últimas reuniões (${meetings.length})</p>
            ${meetings.length > 5 ? `<span class="text-[10px] text-slate-500">Mostrando 5</span>` : ''}
          </div>
          ${meetings.length === 0 ? `<p class="text-xs text-slate-500 text-center py-3">Nenhuma.</p>` :
            `<div class="space-y-1.5">${meetings.slice(0, 5).map(m => {
              const d = new Date(m.date + 'T00:00:00').toLocaleDateString('pt-BR');
              return `<div class="flex items-center justify-between gap-2 p-2 rounded-lg bg-dark-bg/60 border border-dark-border">
                <div class="min-w-0 flex-1"><p class="text-xs font-semibold text-white truncate">${UI.escapeHtml(m.theme)}</p><p class="text-[10px] text-slate-500">${d}</p></div>
                <div class="flex items-center gap-2 flex-shrink-0 text-[10px]"><span class="text-cyan-400 font-bold">👥 ${m.attendeesCount}</span>${+m.conversionsCount > 0 ? `<span class="text-emerald-400 font-bold">+${m.conversionsCount}</span>` : ''}</div>
              </div>`;
            }).join('')}</div>`}
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-dark-border">
          <button class="btn btn-ghost" onclick="UI.closeModal()">Fechar</button>
        </div>
        <p class="text-[10px] text-slate-500 text-center mt-3">Somente leitura · Ações operacionais são do líder</p>
      </div>
    </div>`;
  },

  editCell(cellId) {
    const c = DB.cells.getById(cellId);
    if (!c) return;
    document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) UI.closeModal()">
      <div class="modal-sheet max-h-[92vh] overflow-y-auto !max-w-lg">
        <h3 class="text-lg font-bold text-white mb-4">Editar Célula</h3>
        <form onsubmit="CoordenadorPage.saveCell(event, '${c.id}')" class="space-y-3">
          <div><label class="label">Nome *</label><input id="ed-cell-name" class="input" required value="${UI.escapeHtml(c.name)}" /></div>
          <div class="grid gap-3 sm:grid-cols-2">
            <div><label class="label">Líder *</label><input id="ed-cell-leader" class="input" required value="${UI.escapeHtml(c.leaderName)}" /></div>
            <div><label class="label">E-mail do Líder</label><input id="ed-cell-email" type="email" class="input" value="${UI.escapeHtml(c.leaderEmail || '')}" /></div>
          </div>
          <div class="grid gap-3 sm:grid-cols-2">
            <div><label class="label">Dia</label><select id="ed-cell-day" class="input">${['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'].map(d => `<option value="${d}" ${c.dayOfWeek === d ? 'selected' : ''} class="bg-dark-bg">${d}</option>`).join('')}</select></div>
            <div><label class="label">Local</label><input id="ed-cell-location" class="input" value="${UI.escapeHtml(c.location || '')}" /></div>
          </div>
          <div><label class="label">Meta de Multiplicação</label><input id="ed-cell-threshold" type="number" min="5" class="input" value="${c.multiplicationThreshold || 30}" /></div>
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="ed-cell-active" ${c.active ? 'checked' : ''} class="w-4 h-4 rounded accent-cyan-500" />
            <label for="ed-cell-active" class="text-xs text-slate-300">Célula ativa</label>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-2">
            <button type="button" class="btn btn-ghost" onclick="CoordenadorPage.openDetail('${c.id}')">Voltar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>`;
  },

  saveCell(e, id) {
    e.preventDefault();
    const name = document.getElementById('ed-cell-name').value.trim();
    const leaderName = document.getElementById('ed-cell-leader').value.trim();
    const leaderEmail = document.getElementById('ed-cell-email').value.trim();
    const dayOfWeek = document.getElementById('ed-cell-day').value;
    const location = document.getElementById('ed-cell-location').value.trim();
    const threshold = +document.getElementById('ed-cell-threshold').value || 30;
    const active = document.getElementById('ed-cell-active').checked;
    if (!name || !leaderName) { UI.toast('Preencha nome e líder.', 'error'); return; }
    DB.cells.update(id, { name, leaderName, leaderEmail, dayOfWeek, location, multiplicationThreshold: threshold, active });
    UI.toast('Célula atualizada!', 'success');
    CoordenadorPage.openDetail(id);
    Router.resolve();
  },

  exportReport() {
    const profile = DB.session.currentProfile();
    const cells = DB.cells.listByCoordinator(profile.id);
    const allCells = cells.length ? cells : DB.cells.list();
    let report = `RELATÓRIO CONSOLIDADO DA REDE\nCoordenador: ${profile.name}\nData: ${new Date().toLocaleString('pt-BR')}\nTotal: ${allCells.length} célula(s)\n\n`;
    allCells.forEach(c => {
      const health = Rules.cellHealth(c.id);
      const members = DB.members.listByCell(c.id);
      const balance = DB.transactions.balance(c.id);
      const risk = Rules.membersAtRisk(c.id).length;
      const freq = Rules.averageAttendance(c.id, 30);
      report += `• ${c.name}\n  Líder: ${c.leaderName} (${c.dayOfWeek})\n  Status: ${health.status}${health.days !== null ? ` (${health.days} dias)` : ''}\n  Membros: ${members.length} | Freq: ${freq !== null ? freq.toFixed(1) : '—'}\n  Saldo: R$ ${balance.toFixed(2)} | Risco: ${risk}\n\n`;
    });
    const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `relatorio-rede-${new Date().toISOString().slice(0, 10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('Relatório exportado.', 'success');
  },

  mount() {},
};

/* ==========================================================================
   CRIAR CÉLULA
   ========================================================================== */
const CellsNewPage = {
  render() {
    return `<header class="mb-6"><h1 class="text-2xl sm:text-3xl font-extrabold text-white">Cadastrar Nova Célula</h1><p class="text-xs sm:text-sm text-cyan-100/60 mt-1">Criar um novo grupo na rede</p></header>
      <form onsubmit="CellsNewPage.submit(event)" class="card p-4 sm:p-6 space-y-3 max-w-2xl">
        <div><label class="label">Nome da Célula *</label><input id="cell-name" class="input" required /></div>
        <div class="grid gap-3 sm:grid-cols-2">
          <div><label class="label">Líder *</label><input id="cell-leader" class="input" required /></div>
          <div><label class="label">E-mail do Líder</label><input id="cell-email" type="email" class="input" /></div>
        </div>
        <div class="grid gap-3 sm:grid-cols-2">
          <div><label class="label">Dia</label><select id="cell-day" class="input">${['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'].map(d => `<option value="${d}" class="bg-dark-bg">${d}</option>`).join('')}</select></div>
          <div><label class="label">Local</label><input id="cell-location" class="input" /></div>
        </div>
        <div><label class="label">Meta de Multiplicação</label><input id="cell-threshold" type="number" min="5" class="input" value="30" /></div>
        <div class="flex flex-col sm:flex-row gap-2 sm:justify-end pt-2"><button type="button" class="btn btn-ghost" onclick="Router.navigate('#/coordenador')">Cancelar</button><button type="submit" class="btn btn-primary">Criar</button></div>
      </form>`;
  },
  submit(e) {
    e.preventDefault();
    const profile = DB.session.currentProfile();
    const name = document.getElementById('cell-name').value.trim();
    const leaderName = document.getElementById('cell-leader').value.trim();
    const leaderEmail = document.getElementById('cell-email').value.trim();
    const dayOfWeek = document.getElementById('cell-day').value;
    const location = document.getElementById('cell-location').value.trim();
    const threshold = +document.getElementById('cell-threshold').value || 30;
    if (!name || !leaderName) { UI.toast('Preencha nome e líder.', 'error'); return; }
    DB.cells.create({ name, leaderName, leaderEmail, dayOfWeek, location, multiplicationThreshold: threshold, coordinatorId: profile.id });
    UI.toast('Célula criada!', 'success'); Router.navigate('#/coordenador');
  },
  mount() {},
};

/* ==========================================================================
   ROUTES + BOOT
   ========================================================================== */
Router.routes = {
  '#/login': LoginPage,
  '#/register': RegisterPage,
  '#/dashboard': DashboardPage,
  '#/reuniao/nova': ReuniaoNovaPage,
  '#/reunioes': ReunioesPage,
  '#/membros': MembrosPage,
  '#/caixa': CaixaPage,
  '#/pastoreio': PastoreioPage,
  '#/coordenador': CoordenadorPage,
  '#/cells/new': CellsNewPage,
};

function boot() {
  seedIfEmpty();
  PWA.init();
  if (!location.hash) location.hash = '#/login';
  window.addEventListener('hashchange', Router.resolve);
  Router.resolve();
}
boot();
</script>
</body>
</html>
